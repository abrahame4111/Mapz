<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapz</title>
  </head>
  <body>
    <div id="app">
      <!-- Left: six button slots. 1 = search, 2 = end route, 3 = lyrics, 4 = map (minimap / full screen); 5-6 are reserved. -->
      <div id="left">
        <button id="btn-search" class="slot" type="button" aria-label="Search destination">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
        </button>
        <button id="btn-stop" class="slot" type="button" aria-label="End route" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
        </button>
        <button id="btn-lyrics" class="slot" type="button" aria-label="Lyrics" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <button id="btn-map" class="slot" type="button" aria-label="Toggle full-screen map" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 6.5 L9 4 L15 6.5 L21 4 V17.5 L15 20 L9 17.5 L3 20 Z M9 4 V17.5 M15 6.5 V20"/></svg>
        </button>
        <div class="slot reserved"></div>
        <div class="slot reserved"></div>
      </div>

      <!-- Middle: the circular minimap. #minimap is a fixed square that always stays in the layout; #map-box inside it is
           the map, which becomes full-screen when the Map button (left column, slot 4) is pressed (the car stays at this square's centre). -->
      <div id="center">
        <div id="minimap">
          <div id="map-box">
            <div id="map"></div>
            <div id="mask"></div>
            <div id="ring"></div>
          </div>
        </div>
      </div>

      <!-- Right: speed when idle, turn-by-turn when navigating -->
      <div id="right">
        <div id="panel">
          <div id="panel-idle">
            <div id="idle-speed">0</div>
            <div id="idle-unit">km/h</div>
            <div id="idle-hint">Press <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg> to pick a destination</div>
          </div>
          <div id="panel-nav" hidden>
            <div id="turn-dist"><span id="turn-dist-value">--</span><span id="turn-dist-unit"></span></div>
            <div id="turn-icon"></div>
            <div id="turn-msg"></div>
          </div>
          <div id="panel-lyrics" hidden>
            <div id="lyr-head"><div id="lyr-title"></div><div id="lyr-artist"></div></div>
            <div id="lyr-view"><div id="lyr-lines"></div><div id="lyr-status"></div></div>
            <button id="lyr-connect" type="button" hidden>Connect Spotify</button>
            <div id="lyr-credit">Song info from Spotify · Lyrics by LRCLIB</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Destination search -->
    <div id="search" hidden>
      <div id="search-card">
        <div id="search-bar">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
          <input id="search-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Where to?" />
          <button id="search-close" type="button" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
        </div>
        <div id="search-status"></div>
        <ul id="search-results"></ul>
      </div>
    </div>

    <!-- Arrival popup -->
    <div id="arrival" hidden>
      <div id="arrival-card">
        <img id="arrival-flag" alt="Finish flag" />
        <button id="arrival-close" type="button">Close</button>
      </div>
    </div>

    <div id="fallback" hidden>
      <h1>Map unavailable</h1>
      <p>This device's WebView does not support WebGL.</p>
    </div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="debug"></div>
    <pre id="diag"></pre>
    <!-- Plain ES5 on purpose: must run even on a WebView too old for the app bundle. -->
    <script>
      (function () {
        var el = document.getElementById("diag");
        window.__diag = function (m) { el.textContent += m + "\n"; el.style.display = "block"; };
        window.__diagHide = function () { el.style.display = "none"; };
        window.__diag("Mapz boot | " + navigator.userAgent);
        window.onerror = function (msg, src, line) { window.__diag("ERROR: " + msg + " @" + String(src).split("/").pop() + ":" + line); };
        window.addEventListener("unhandledrejection", function (e) { window.__diag("REJECTED: " + (e.reason && e.reason.message || e.reason)); });
        setTimeout(function () { if (!window.__appStarted) window.__diag("App script did not start (WebView too old?)"); }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
